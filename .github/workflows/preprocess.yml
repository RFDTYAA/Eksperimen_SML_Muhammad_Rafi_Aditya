name: Auto Preprocessing Advanced

on:
  push:
    paths:
      - 'preprocessing/automate_*.py'
  workflow_dispatch:

jobs:
  run-preprocessing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn joblib
      
      - name: Run Automated Preprocessing
        run: |
          cd preprocessing
          python automate_Muhammad_Rafi_Aditya.py
      
      - name: Upload Latest Preprocessed Dataset
        uses: actions/upload-artifact@v4
        with:
          name: preprocessed-dataset-latest
          path: preprocessing/namadataset_preprocessing/
          retention-days: 90
